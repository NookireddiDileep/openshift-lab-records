# OCP-001 – v1: bare Pod as first deployed (works, but triggers PodSecurity "restricted" warnings)
apiVersion: v1
kind: Pod
metadata:
  name: app-01
  labels:
    app: app-01
spec:
  containers:
  - name: app-01
    image: registry.access.redhat.com/ubi9/httpd-24
    ports:
    - containerPort: 8080
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 128Mi }
  restartPolicy: Always
