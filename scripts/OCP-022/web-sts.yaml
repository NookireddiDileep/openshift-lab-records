# OCP-022 – StatefulSet: 3 replicas, one 1Gi RWO PVC each from the default StorageClass, headless Service
apiVersion: v1
kind: Service
metadata: { name: web, labels: { app: web-sts } }
spec:
  clusterIP: None                     # headless: stable per-Pod DNS  <pod>.<svc>.<ns>.svc.cluster.local
  selector: { app: web-sts }
  ports: [ { name: dummy, port: 8080 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: web, labels: { app: web-sts } }
spec:
  serviceName: web
  replicas: 3
  selector: { matchLabels: { app: web-sts } }
  template:
    metadata: { labels: { app: web-sts } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/ubi-minimal
        command: ["/bin/sh", "-c"]
        # NOTE: sh + sleep ignores SIGTERM → each Pod takes the full 30 s grace period to stop.
        # Better: trap the signal, e.g.  trap 'exit 0' TERM; ...; sleep infinity & wait
        args:
        - echo "$(date -u +%H:%M:%S) started $POD_NAME" >> /data/history.log; sleep infinity
        env:
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 50m, memory: 32Mi } }
        volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ ReadWriteOnce ]
      resources: { requests: { storage: 1Gi } }
      # no storageClassName → the cluster's default StorageClass is used
