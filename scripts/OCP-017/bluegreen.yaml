# OCP-017 – Blue-Green: two full versions side by side; switch traffic by repointing the Route
apiVersion: v1
kind: ConfigMap
metadata: { name: bg-blue-html, labels: { app: bg } }
data:
  index.html: '<html><body style="background:#1e6fd9;color:white"><h1>BLUE - version 1</h1></body></html>'
---
apiVersion: v1
kind: ConfigMap
metadata: { name: bg-green-html, labels: { app: bg } }
data:
  index.html: '<html><body style="background:#1f9d55;color:white"><h1>GREEN - version 2</h1></body></html>'
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bg-blue, labels: { app: bg, version: blue } }
spec:
  replicas: 2
  selector: { matchLabels: { app: bg, version: blue } }
  template:
    metadata: { labels: { app: bg, version: blue } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/httpd-24
        ports: [ { containerPort: 8080 } ]
        readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 3 }
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
        volumeMounts: [ { name: html, mountPath: /var/www/html } ]
      volumes: [ { name: html, configMap: { name: bg-blue-html } } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bg-green, labels: { app: bg, version: green } }
spec:
  replicas: 2
  selector: { matchLabels: { app: bg, version: green } }
  template:
    metadata: { labels: { app: bg, version: green } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/httpd-24
        ports: [ { containerPort: 8080 } ]
        readinessProbe: { httpGet: { path: /, port: 8080 }, periodSeconds: 3 }
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
        volumeMounts: [ { name: html, mountPath: /var/www/html } ]
      volumes: [ { name: html, configMap: { name: bg-green-html } } ]
---
apiVersion: v1
kind: Service
metadata: { name: bg-blue, labels: { app: bg } }
spec: { selector: { app: bg, version: blue }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: bg-green, labels: { app: bg } }
spec: { selector: { app: bg, version: green }, ports: [ { port: 8080, targetPort: 8080 } ] }
